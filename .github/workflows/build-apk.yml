name: Build PixAI Nexus Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Release APK
      run: gradle assembleRelease --stacktrace --no-daemon

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: PixAI-Nexus-Release-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Publish Release APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      with:
        name: "PixAI Nexus Release ${{ github.ref_name }}"
        body: "PixAI Nexus Release ${{ github.ref_name }}: Hàng đợi tạo ảnh đa tiến trình song song (không chặn timeout 300s), lưu ngay vào lịch sử mã hóa trạng thái PENDING và tự cập nhật ảnh khi GPU hoàn thành, ưu tiên chuẩn web PixAI kết xuất siêu tốc (~24s), tự động xoay tài khoản đủ số dư chính xác."
        files: app/build/outputs/apk/release/*.apk
        token: ${{ secrets.GITHUB_TOKEN }}
