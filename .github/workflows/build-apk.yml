name: Build PixAI Nexus Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Release APK
      run: gradle assembleRelease --stacktrace --no-daemon

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: PixAI-Nexus-v1.0.0-Release-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Publish Release APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
      with:
        tag_name: v1.0.0
        name: "PixAI Nexus Release v1.0.0"
        body: "Bản phát hành PixAI Nexus v1.0.0 độc lập: Giao diện Cyber Glassmorphism siêu đẹp (không icon), toàn bộ mạng chạy qua Proxy Shield, hỗ trợ Tsubaki 3 Flash / Pro / Ultra, lựa chọn Anime / Thực Tế (tự động gắn LoRA chuẩn), tùy chọn kích thước, tỉ lệ, đính kèm ảnh mẫu (tự loại LoRA), tự động xoay tua 44 tài khoản khi hết credits, tự động Reg Acc nhận 80K, nhận Daily hàng loạt và lưu lịch sử ảnh kèm prompt gốc + prompt do server sửa."
        files: app/build/outputs/apk/release/*.apk
        token: ${{ secrets.GITHUB_TOKEN }}
